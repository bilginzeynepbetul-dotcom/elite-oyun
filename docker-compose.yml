services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: em
      POSTGRES_PASSWORD: em
      POSTGRES_DB: elite_manager
    ports:
      - "5432:5432"
    volumes:
      - em_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U em -d elite_manager"]
      interval: 3s
      timeout: 5s
      retries: 20

  api:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://em:em@db:5432/elite_manager
      # Yerel geliştirme — production'da Render env kullan
      JWT_SECRET: local-dev-only-change-me-32chars
      ADMIN_USERNAME: admin
      NODE_ENV: development
      ELITE_ALLOW_MOCK: "0"
      PORT: "3000"
      CORS_ORIGIN: "http://localhost:3000"
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "node scripts/migrate.js && node server.js"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  em_pg:

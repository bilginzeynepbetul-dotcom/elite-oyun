databases:
  - name: elite-manager-db
    plan: free
    databaseName: elite_manager
    user: elite_manager

services:
  - type: web
    name: elite-manager
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elite-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 7d
      - key: ADMIN_USERNAME
        value: murat
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        sync: false
      - key: ELITE_ALLOW_MOCK
        value: "0"

databases:
  - name: elite-manager-db
    plan: free
    databaseName: elite_manager
    user: elite_manager

services:
  - type: web
    name: elite-manager
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elite-manager-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: 2h
      - key: JWT_REFRESH_EXPIRES
        value: 30d
      # Dashboard'dan kendi admin kullanıcı adını yaz (kayıt olduğun username)
      - key: ADMIN_USERNAME
        sync: false
      - key: NODE_ENV
        value: production
      # ZORUNLU: https://senin-domain.com (virgülle birden fazla)
      - key: CORS_ORIGIN
        sync: false
      - key: ELITE_ALLOW_MOCK
        value: "0"
      - key: PUBLIC_URL
        sync: false
      # Bağış bilgileri (Dashboard'dan doldur)
      - key: DONATION_IBAN
        sync: false
      - key: DONATION_IBAN_NAME
        sync: false
      - key: DONATION_PAPARA
        sync: false
      - key: DONATION_PAPARA_NAME
        sync: false
      - key: DONATION_NOTE
        value: Açıklamaya kullanıcı adınızı yazın. Ödeme sonrası Elite sayfasından bağışı bildirin.

  # Haftalık KVKK / log temizliği (Pazar 04:00 UTC)
  - type: cron
    name: elite-manager-retention
    runtime: docker
    plan: free
    schedule: "0 4 * * 0"
    dockerCommand: npm run retention
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elite-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: RETENTION_ANTI_CHEAT_DAYS
        value: "90"
      - key: RETENTION_ADMIN_AUDIT_DAYS
        value: "365"
      - key: RETENTION_ACCOUNT_DELETION_LOG_DAYS
        value: "730"
      - key: RETENTION_CLEAR_EXPIRED_EMAIL_TOKENS
        value: "1"

  # Günlük DB yedek denemesi (03:15 UTC)
  # NOT: Free disk geçicidir — kalıcı yedek için dış depolama (S3 vb.) gerekir.
  # pg_dump imajda vardır; çıktı /app/backups (ephemeral).
  - type: cron
    name: elite-manager-backup
    runtime: docker
    plan: free
    schedule: "15 3 * * *"
    dockerCommand: npm run backup
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elite-manager-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: BACKUP_DIR
        value: /app/backups
      - key: BACKUP_KEEP
        value: "7"
